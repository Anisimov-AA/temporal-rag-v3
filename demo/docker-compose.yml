services:
  ollama:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  models:
    image: ollama/ollama:0.40.17
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull bge-m3 && ollama pull gemma4:26b-a4b-it-q4_K_M"]

  app:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    depends_on:
      models:
        condition: service_completed_successfully
    environment:
      GCP_OLLAMA: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ../snapshots:/app/snapshots:ro
      - index:/app/index
      - hf:/root/.cache/huggingface
    ports:
      - "7860:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
  index:
  hf:
